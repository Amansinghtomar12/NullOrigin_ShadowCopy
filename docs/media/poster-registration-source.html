<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Bangers'; src: url('file:///home/user/NullOrigin_ShadowCopy/public/fonts/bangers-400-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Fira Code'; font-weight: 700; src: url('file:///home/user/NullOrigin_ShadowCopy/public/fonts/fira-code-700-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url('file:///home/user/NullOrigin_ShadowCopy/public/fonts/inter-600-latin.woff2') format('woff2'); }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1350px; overflow: hidden; position: relative;
    background: #0a0a12; font-family: 'Inter', sans-serif;
  }

  /* ── scene: glows, node mesh, neon grid floor in real perspective ── */
  .glow-top { position: absolute; width: 1100px; height: 620px; left: -10px; top: -240px;
    background: radial-gradient(closest-side, rgba(255,51,85,.34), transparent); }
  .glow-amber { position: absolute; width: 600px; height: 400px; right: -140px; top: 430px;
    background: radial-gradient(closest-side, rgba(255,194,60,.13), transparent); }
  .core { position: absolute; left: 50%; top: 305px; width: 340px; height: 90px; transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(255,120,140,.5), rgba(255,51,85,.18) 60%, transparent);
    filter: blur(6px); }

  .floor {
    position: absolute; left: -20%; right: -20%; bottom: -40px; height: 560px;
    transform: perspective(700px) rotateX(58deg);
    transform-origin: 50% 100%;
    background-image:
      linear-gradient(rgba(255,51,85,.44) 2px, transparent 2px),
      linear-gradient(90deg, rgba(255,51,85,.44) 2px, transparent 2px);
    background-size: 74px 74px;
    -webkit-mask-image: linear-gradient(to top, #000 40%, transparent 96%);
  }

  svg.mesh { position: absolute; inset: 0; }

  .frame { position: absolute; inset: 22px; border: 3px solid rgba(255,51,85,.42); border-radius: 44px; }

  /* ── content ── */
  .wrap { position: relative; height: 100%; padding: 66px 72px; text-align: center; }

  .presents {
    font-family: 'Fira Code', monospace; font-weight: 700; font-size: 19px;
    letter-spacing: .34em; color: #99a2ad; text-transform: uppercase; margin-top: 8px;
  }
  .maskbox { height: 128px; width: 168px; margin: 18px auto 0; overflow: hidden;
    -webkit-mask-image: radial-gradient(70% 88% at 50% 42%, #000 55%, transparent 92%); }
  .maskbox img { width: 168px; object-fit: cover; object-position: top;
    filter: drop-shadow(0 0 30px rgba(255,51,85,.6)); }

  h1 {
    font-family: 'Bangers', cursive; font-weight: 400; font-size: 168px;
    line-height: .92; letter-spacing: .03em; text-transform: uppercase; margin-top: 6px;
    background: linear-gradient(180deg, #ff6b85 0%, #ff3355 48%, #ffc23c 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 8px 0 rgba(0,0,0,.6)) drop-shadow(0 0 34px rgba(255,51,85,.35));
    transform: perspective(900px) rotateX(8deg);
  }
  .tag {
    font-family: 'Fira Code', monospace; font-weight: 700; font-size: 25px;
    letter-spacing: .3em; color: #ffc23c; text-transform: uppercase; margin-top: 20px;
  }

  /* ── 3D chip cards, fanned like the site's stage3d ── */
  .cards { display: flex; justify-content: center; gap: 20px; margin-top: 40px; perspective: 900px; }
  .card {
    width: 218px; padding: 24px 10px 22px;
    background: rgba(28,8,16,.72); border: 2.5px solid rgba(255,51,85,.5);
    border-radius: 26px;
    box-shadow: 0 14px 0 -6px rgba(0,0,0,.55), 0 22px 44px rgba(0,0,0,.5);
  }
  .card .n { font-family: 'Bangers', cursive; font-size: 54px; color: #ff4d6a;
    text-shadow: 0 0 22px rgba(255,77,106,.4); line-height: 1; }
  .card .l { font-family: 'Fira Code', monospace; font-weight: 700; font-size: 15px;
    letter-spacing: .22em; color: #b8bfc7; text-transform: uppercase; margin-top: 10px; }
  .card--left  { transform: rotateY(16deg) translateZ(-24px); }
  .card--right { transform: rotateY(-16deg) translateZ(-24px); }
  .card--mid   { transform: translateZ(14px) scale(1.05); border-color: rgba(255,194,60,.55); }
  .card--mid .n { color: #ffc23c; text-shadow: 0 0 22px rgba(255,194,60,.45); }

  /* ── QR plate: white card tipped in 3D with comic shadow ── */
  .qr-zone { position: absolute; left: 0; right: 0; bottom: 118px; display: flex;
    justify-content: center; align-items: center; gap: 46px; perspective: 1000px; }
  .qr-card {
    background: #f4f6f5; border-radius: 30px; padding: 24px;
    transform: rotateY(-14deg) rotateX(4deg);
    box-shadow: 18px 22px 0 -4px rgba(0,0,0,.55), 0 0 60px rgba(255,51,85,.35);
    border: 4px solid #ff3355;
  }
  .qr-card img { display: block; width: 268px; height: 268px; }
  .qr-card .scan { font-family: 'Fira Code', monospace; font-weight: 700; font-size: 16px;
    letter-spacing: .22em; color: #0a0a12; text-transform: uppercase; text-align: center; margin-top: 12px; }

  .qr-copy { text-align: left; transform: rotateY(10deg); max-width: 400px; }
  .qr-copy .free { font-family: 'Bangers', cursive; font-size: 66px; line-height: 1;
    color: #f4f6f5; text-shadow: 0 5px 0 rgba(0,0,0,.55); }
  .qr-copy .free em { font-style: normal; color: #ffc23c; }
  .qr-copy .sub { font-family: 'Fira Code', monospace; font-weight: 700; font-size: 20px;
    letter-spacing: .16em; color: #ff6b85; text-transform: uppercase; margin-top: 16px; }
  .qr-copy .via { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 17.5px;
    color: #b8bfc7; margin-top: 14px; line-height: 1.6; white-space: nowrap; }

  .footer {
    position: absolute; left: 0; right: 0; bottom: 52px; text-align: center;
    font-family: 'Fira Code', monospace; font-weight: 700; font-size: 21px;
    letter-spacing: .26em; color: #99a2ad;
  }
  .footer b { color: #ff4d6a; }
</style>
</head>
<body>
  <div class="glow-top"></div>
  <div class="glow-amber"></div>
  <div class="core"></div>
  <div class="floor"></div>
  <svg class="mesh" width="1080" height="1350" viewBox="0 0 1080 1350"></svg>
  <div class="frame"></div>

  <div class="wrap">
    <div class="presents">Team CyberXoX × CyberHX present</div>
    <div class="maskbox"><img src="file:///home/user/NullOrigin_ShadowCopy/public/mask.png"></div>
    <h1>Null<br>Origin</h1>
    <div class="tag">Capture The Flag &middot; 18 Sep 2026</div>

    <div class="cards">
      <div class="card card--left"><div class="n">24H</div><div class="l">Of Battle</div></div>
      <div class="card card--mid"><div class="n">2</div><div class="l">Rounds</div></div>
      <div class="card card--right"><div class="n">6</div><div class="l">Domains</div></div>
    </div>
  </div>

  <div class="qr-zone">
    <div class="qr-card">
      <img src="unstop-qr.png">
      <div class="scan">Scan &middot; Register</div>
    </div>
    <div class="qr-copy">
      <div class="free">Free entry.<br><em>Every flag counts.</em></div>
      <div class="sub">Teams of 1&ndash;4 &middot; Online</div>
      <div class="via">Crypto &middot; Web &middot; Rev &middot; OSINT &middot; Forensics &middot; Pwn<br>Register on Unstop</div>
    </div>
  </div>

  <div class="footer"><b>nullorigin.cyberhx.com</b></div>

  <script>
    // Sparse red node mesh, same voice as the site's living background.
    const svg = document.querySelector('svg.mesh');
    const N = 46, pts = [];
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < N; i++) pts.push([rnd() * 1080, rnd() * 1350]);
    let out = '';
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      const dx = pts[i][0]-pts[j][0], dy = pts[i][1]-pts[j][1];
      if (Math.hypot(dx, dy) < 190)
        out += `<line x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${pts[j][0]}" y2="${pts[j][1]}" stroke="rgba(255,51,85,0.16)" stroke-width="1.4"/>`;
    }
    for (const [x, y] of pts)
      out += `<circle cx="${x}" cy="${y}" r="${2 + rnd()*2}" fill="rgba(255,77,106,0.5)"/>`;
    svg.innerHTML = out;
  </script>
</body>
</html>
