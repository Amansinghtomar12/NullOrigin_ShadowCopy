<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Null Origin CTF — Ultimate Cybersecurity Battleground</title>
    
    <!-- General SEO Metadata -->
    <meta name="description" content="Null Origin CTF is a premier, highly-immersive cybersecurity hacking competition. Challenge your skills in cryptography, reverse engineering, binary exploitation, web security, and digital forensics. Pre-register today to secure your node in the network." />
    <meta name="keywords" content="Null Origin, Null Origin CTF, Capture The Flag, cyberhx, cyberhx ctf, hacking competition, cybersecurity, reverse engineering, binary exploitation, web security, web penetration testing, cryptography, forensics, ethical hacking, cyber arena" />
    <meta name="author" content="Null Origin" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://nullorigin.cyberhx.com/" />
    <meta name="theme-color" content="#ff3355" />

    <!-- Open Graph / Facebook Social Sharing Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nullorigin.cyberhx.com/" />
    <meta property="og:title" content="Null Origin CTF — Ultimate Cybersecurity Battleground" />
    <meta property="og:description" content="Unleash your potential in world-class offensive and defensive security challenges. Cryptography, binary exploitation, reverse engineering, and web security. Join the system." />
    <meta property="og:image" content="https://nullorigin.cyberhx.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Social Sharing Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://nullorigin.cyberhx.com/" />
    <meta name="twitter:title" content="Null Origin CTF — Ultimate Cybersecurity Battleground" />
    <meta name="twitter:description" content="Unleash your potential in world-class offensive and defensive security challenges. Cryptography, binary exploitation, reverse engineering, and web security. Join the system." />
    <meta name="twitter:image" content="https://nullorigin.cyberhx.com/og.png" />

    <!-- Structured data: lets Google surface the event dates and free
         entry directly in search results. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Event",
      "name": "Null Origin CTF 2026",
      "description": "Premier online Capture The Flag competition — 24 hours of CTF in two 12-hour rounds (Qualifier + Grand Finale) across six attack domains: cryptography, web exploitation, reverse engineering, OSINT, forensics and pwn.",
      "startDate": "2026-09-18T10:00:00+05:30",
      "endDate": "2026-09-26",
      "eventStatus": "https://schema.org/EventScheduled",
      "eventAttendanceMode": "https://schema.org/OnlineEventAttendanceMode",
      "location": {
        "@type": "VirtualLocation",
        "url": "https://nullorigin.cyberhx.com/"
      },
      "image": "https://nullorigin.cyberhx.com/og.png",
      "organizer": {
        "@type": "Organization",
        "name": "Team CyberXoX",
        "url": "https://nullorigin.cyberhx.com/"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock",
        "url": "https://nullorigin.cyberhx.com/register"
      }
    }
    </script>

    <!-- Brand icon styling -->
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Cartoon-poster theme fonts (Bangers = display, Inter = body,
         Fira Code = labels) are self-hosted from /public/fonts and
         declared in src/fonts.css, so there is no third-party request on
         the critical path. Preload only the two above-the-fold faces. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/bangers-400-latin.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-400-latin.woff2" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
