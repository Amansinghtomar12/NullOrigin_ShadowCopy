<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 · Null Origin CTF</title>
<link rel="icon" href="/mask.png" />
<style>
  @font-face {
    font-family: 'Bangers';
    src: url(/fonts/bangers-400-latin.woff2) format('woff2');
    font-display: swap;
  }
  @font-face {
    font-family: 'Fira Code';
    src: url(/fonts/fira-code-400-latin.woff2) format('woff2');
    font-display: swap;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(900px 620px at 50% 40%, rgba(255, 77, 106, 0.10), transparent 70%),
      #0a0812;
    color: #f4f6f5;
    font-family: 'Fira Code', ui-monospace, monospace;
  }
  .panel {
    width: min(560px, 100%);
    background: rgba(28, 8, 16, 0.75);
    border: 3px solid rgba(255, 51, 85, 0.45);
    border-radius: 28px;
    box-shadow: 0 18px 0 -6px rgba(0,0,0,.55), 0 26px 60px rgba(0,0,0,.55);
    padding: 34px clamp(22px, 5vw, 40px) 38px;
    text-align: center;
  }
  .code {
    font-family: 'Bangers', system-ui, cursive;
    font-size: clamp(64px, 16vw, 110px);
    line-height: 1;
    letter-spacing: 0.04em;
    color: #ffc23c;
    background: linear-gradient(180deg, #ff6b85 0%, #ff3355 45%, #ffc23c 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 0 rgba(0,0,0,.55));
  }
  .tag {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #ff4d6a;
    margin-top: 14px;
  }
  .log {
    margin: 22px auto 0;
    max-width: 40ch;
    text-align: left;
    font-size: 12.5px;
    line-height: 2;
    color: #b8bfc7;
    border: 2px solid rgba(255, 51, 85, 0.3);
    border-radius: 14px;
    padding: 14px 18px;
    background: rgba(10, 3, 7, 0.5);
    overflow-x: auto;
  }
  .log .p { color: #ff4d6a; }
  .log .err { color: #ffc23c; }
  .caret {
    display: inline-block;
    width: 8px;
    height: 14px;
    vertical-align: -2px;
    background: #ff4d6a;
    animation: blink 1.06s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  a.home {
    display: inline-block;
    margin-top: 26px;
    padding: 13px 30px;
    border-radius: 999px;
    border: 3px solid #000;
    box-shadow: 0 6px 0 #000;
    background: #ff3355;
    color: #fff;
    font-family: 'Bangers', system-ui, cursive;
    font-size: 18px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-decoration: none;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  a.home:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #000; }
  a.home:active { transform: translateY(3px); box-shadow: 0 2px 0 #000; }
  @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
</style>
</head>
<body>
  <main class="panel">
    <div class="code">404</div>
    <p class="tag">Node not found</p>
    <div class="log" role="status">
      <div><span class="p">›</span> probing requested path … <span class="err">[MISS]</span></div>
      <div><span class="p">›</span> no challenge node at this address</div>
      <div><span class="p">›</span> the flag you seek is not here <span class="caret"></span></div>
    </div>
    <a class="home" href="/">Return to base</a>
  </main>
  <!-- nice try, operator. the warm-up flag lives somewhere else entirely. -->
</body>
</html>
