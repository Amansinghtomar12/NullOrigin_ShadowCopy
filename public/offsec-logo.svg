<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" role="img" aria-label="OffSec">
  <defs>
    <linearGradient id="offsec-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35c8d8"/>
      <stop offset="0.55" stop-color="#2f7de0"/>
      <stop offset="1" stop-color="#6a3ff0"/>
    </linearGradient>
    <!-- the two gate cuts are punched straight through to transparency -->
    <mask id="offsec-cut">
      <rect x="0" y="0" width="860" height="260" fill="#fff"/>
      <polygon points="104,0 156,0 172,260 88,260" fill="#000"/>
    </mask>
  </defs>

  <!-- the roundel, with the gate corridor removed -->
  <circle cx="130" cy="120" r="110" fill="url(#offsec-g)" mask="url(#offsec-cut)"/>
  <!-- the centre pillar, widening as it drops past the circle's foot -->
  <polygon points="118,8 142,8 158,252 102,252" fill="url(#offsec-g)"/>

  <!-- wordmark -->
  <text x="272" y="172" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="150" font-weight="800" letter-spacing="-4" fill="#ffffff">OffSec</text>
  <text x="778" y="72" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#ffffff">™</text>
</svg>
